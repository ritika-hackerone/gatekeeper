services:
  - type: web
    name: abr-p3-gatekeeper-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=src uvicorn gatekeeper.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
        services:
  - type: web
    name: abr-p3-gatekeeper-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=src uvicorn gatekeeper.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET_KEY
        generateValue: true
      ...
